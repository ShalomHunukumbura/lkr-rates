[project]
name = "lkr-rates"
version = "0.1.0"
description = "A clean daily archive of Sri Lankan rupee exchange rates, built from Central Bank of Sri Lanka data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["duckdb>=1.1"]

[project.scripts]
lkr-rates = "lkr_rates.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lkr_rates"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
